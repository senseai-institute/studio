[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "senseai-studio"
version = "0.1.0"
description = "SenseAI Studio: work on species sense models. Sources, model, real-time run, pipeline and use cases, every item traced to a file."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SenseAI Institute" }]
requires-python = ">=3.11"
# Upstream repos are read as checkouts and called as CLIs or through a probe subprocess, never
# imported here; numpy and jsonschema are what senseai-profiles needs when the probe imports it
# from the profiles checkout with this interpreter.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "markdown-it-py>=3.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "playwright==1.56.0",
  "openapi-spec-validator>=0.7",
  "pillow>=10.0",
  "h5py>=3.10",
]

[project.scripts]
senseai-studio = "senseai_studio.cli:main"

[project.urls]
Homepage = "https://github.com/senseai-institute/studio"

[tool.hatch.build.targets.wheel]
packages = ["src/senseai_studio"]
# The built web app is git-ignored but must ship in the wheel and image.
artifacts = ["src/senseai_studio/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "D401", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"src/senseai_studio/probe.py" = ["D103"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["markdown_it", "markdown_it.*", "senseai_profiles", "senseai_profiles.*", "senseai_bench", "senseai_bench.*", "torch"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=senseai_studio --cov-report=term-missing:skip-covered --cov-fail-under=80"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
omit = ["*/static/*", "*/probe.py"]
